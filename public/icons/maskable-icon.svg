<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#12244a"/>
      <stop offset="60%" stop-color="#0a1326"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fe0ff"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- fundo full-bleed (área de segurança do maskable) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <path d="M0 128H512 M0 256H512 M0 384H512 M128 0V512 M256 0V512 M384 0V512"
        stroke="#38bdf8" stroke-width="1" opacity="0.06"/>

  <!-- moldura e N dentro da zona segura (central ~60%) -->
  <polygon points="256,140 372,256 256,372 140,256" fill="none" stroke="#1d4ed8" stroke-width="3" opacity="0.5"/>
  <path d="M201 320 V192 L311 320 V192" fill="none" stroke="url(#n)"
        stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
