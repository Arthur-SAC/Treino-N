<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#12244a"/>
      <stop offset="58%" stop-color="#0a1326"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9fe0ff"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- grade do HUD -->
  <path d="M0 128H512 M0 256H512 M0 384H512 M128 0V512 M256 0V512 M384 0V512"
        stroke="#38bdf8" stroke-width="1" opacity="0.07"/>

  <!-- moldura diamante (portal) -->
  <polygon points="256,72 440,256 256,440 72,256" fill="none" stroke="#1d4ed8" stroke-width="3" opacity="0.55"/>
  <polygon points="256,104 408,256 256,408 104,256" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>

  <!-- N -->
  <path d="M180 344 V168 L332 344 V168" fill="none" stroke="url(#n)"
        stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- cantos em colchete -->
  <g stroke="#38bdf8" stroke-width="6" fill="none" opacity="0.9" stroke-linecap="round">
    <path d="M40 96 V40 H96"/>
    <path d="M416 40 H472 V96"/>
    <path d="M472 416 V472 H416"/>
    <path d="M96 472 H40 V416"/>
  </g>
</svg>
